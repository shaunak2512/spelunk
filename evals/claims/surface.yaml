area: MCP surface, CLI, packaging, tool-call logging
prefix: MCP
claims:
- id: MCP-001
  claim: build_server(session) registers 7 tools and 2 resources, plus 3 more tools behind
    --allow-add-source, plus `show` and its ui:// renderer resource when the optional [ui]
    extra is installed.
  source: CLAUDE.md#mcp/server.py
  mode: behavioral
  falsifier: A documented tool or resource is missing, or an undocumented one is exposed.
  status: verified
  covered_by:
  - tests/test_cli.py::TestStdioTransport::test_registered_surface_is_exactly_the_documented_one
  - tests/test_cli.py::TestStdioTransport::test_gated_tools_absent_without_the_flag
  - tests/test_cli.py::TestSourceArguments::test_allow_add_source_registers_the_gated_tools
  - tests/test_cli.py::TestStdioTransport::test_resources_are_served
  - tests/test_mcp_server.py::TestRegistration::test_resources_registered
  - tests/test_mcp_server.py::TestOtherTools::test_lineage_and_replay_registered
  - tests/test_mcp_server.py::TestRegistration::test_no_import_remote_tool
  note: 'The in-process registration tests assert documented names are a SUBSET of what is registered,
    so an EXTRA exposed tool passed them. The CLI test now asserts set EQUALITY against the documented
    7, over the real transport. (The older subset test is still called test_five_core_tools_registered
    — stale name, harmless now that equality is pinned.)

    '
- id: MCP-002
  claim: The @_logged decorator preserves each function's signature, so FastMCP's schema is unchanged.
  source: CLAUDE.md#tool-call-logging
  mode: behavioral
  falsifier: A wrapped tool's advertised parameter schema differs from the undecorated function's.
  status: verified
  covered_by:
  - tests/test_contracts.py::TestToolSchemas::test_every_tool_advertises_its_real_parameters
  - tests/test_contracts.py::TestToolSchemas::test_gated_tools_keep_their_parameters_too
  note: Exact parameter sets per tool. If @_logged stopped preserving signatures every tool would
    advertise (*args, **kwargs), and this is what catches it.
- id: MCP-003
  claim: Every tool call appends ONE JSON line with ts, tool, args, outcome, result summary, duration_ms.
  source: CLAUDE.md#tool-call-logging
  mode: behavioral
  falsifier: A call logs zero or two lines, or a documented field is absent.
  status: verified
  covered_by:
  - tests/test_mcp_server.py::TestToolLogging::test_each_call_logs_one_json_line
  - tests/test_mcp_server.py::TestToolLogging::test_batch_call_logs_steps_and_summary
  - tests/test_mcp_server.py::TestToolLogging::test_failed_call_logs_error_outcome
- id: MCP-004
  claim: '--tool-log takes a file path, ''-'' for stderr, or ''off''; the default is <session-dir>/tool-calls.jsonl
    when --session-dir is set, else stderr — NEVER stdout (that is the stdio MCP transport).

    '
  source: CLAUDE.md#tool-call-logging
  mode: invariant
  falsifier: Any log byte reaches stdout, corrupting the MCP stream.
  status: verified
  covered_by:
  - tests/test_cli.py::TestStdoutPurity::test_every_stdout_line_is_protocol
  - tests/test_cli.py::TestToolLogSink::test_default_log_lands_in_the_per_process_workspace
  - tests/test_cli.py::TestToolLogSink::test_off_writes_no_log
  - tests/test_cli.py::TestToolLogSink::test_explicit_path_is_honoured
  note: 'Every stdout line of a real subprocess run must parse as JSON-RPC, exercised with --tool-log
    - (logs actively writing to stderr) and including a FAILING call, since error paths are where
    stray output hides. All three sink modes and the default resolution are pinned alongside it.

    '
- id: MCP-005
  claim: The tool log lives inside the workspace dir, so it is reclaimed with it — route --tool-log
    elsewhere to retain history.
  source: CLAUDE.md#running-the-server
  mode: behavioral
  falsifier: A log written outside the workspace is deleted by GC, or a default log survives reclamation.
  status: partial
  covered_by:
  - tests/test_cli.py::TestToolLogSink::test_default_log_lands_in_the_per_process_workspace
  - tests/test_cli.py::TestToolLogSink::test_explicit_path_is_honoured
  gap: 'Location is pinned now — the default lands in <session-dir>/<pid>-<rand>/, an explicit path
    goes where told. The RECLAMATION half is still untested: nothing proves a default log is swept
    away with its workspace while a redirected one survives. That is the data-loss-shaped part of
    the claim.

    '
- id: MCP-006
  claim: Library callers of build_server(session) log NOWHERE unless passed tool_log=.
  source: CLAUDE.md#tool-call-logging
  mode: behavioral
  falsifier: A library embedding writes a JSONL file it never asked for.
  status: verified
  covered_by:
  - tests/test_contracts.py::TestLibraryCallersDoNotLog::test_no_log_file_is_created
  note: Asserted by sweeping the whole temp tree for stray .jsonl files after driving tools.
- id: MCP-007
  claim: The JSONL is queryable by Spelunk itself via read_json_auto(...).
  source: CLAUDE.md#tool-call-logging
  mode: behavioral
  falsifier: The log's own shape defeats DuckDB inference (heterogeneous args across tools).
  status: verified
  covered_by:
  - tests/test_contracts.py::TestToolLogIsQueryableBySpelunk::test_a_mixed_tool_log_reads_back_as_a_table
  note: 'Suspected refutable — `args` differs per tool, the shape that trips JSON inference elsewhere.
    It HOLDS: a log mixing single queries, a batch, catalog, drop and a failed call reads back via
    read_json_auto and groups by tool.'
- id: MCP-008
  claim: The server's `instructions` block documents the tool surface an agent should follow.
  source: server.py#instructions
  mode: behavioral
  falsifier: The instructions describe a tool, parameter, or column that does not exist.
  status: verified
  covered_by:
  - tests/test_contracts.py::TestServerInstructions::test_every_tool_named_in_the_instructions_is_registered
  - tests/test_contracts.py::TestServerInstructions::test_resource_uris_named_in_the_instructions_exist
  note: Every `name(` mention in the instructions must resolve to a registered tool, in both the gated
    and ungated builds.
- id: MCP-009
  claim: --source is repeatable and auto-detects by extension/scheme; --dsn is a back-compat alias
    for one --source.
  source: CLAUDE.md#running-the-server
  mode: behavioral
  falsifier: A second --source overwrites the first, or --dsn is ignored.
  status: verified
  covered_by:
  - tests/test_cli.py::TestSourceArguments::test_source_is_repeatable_and_dsn_is_an_alias
  - tests/test_cli.py::TestStdioTransport::test_query_spans_both_sources_through_the_transport
  note: 'main() now runs as a real subprocess in tests/test_cli.py, so the startup path (arg parsing,
    source wiring, stdio transport, tool-log resolution, clean shutdown on closed stdin) is exercised
    end to end rather than assumed.

    '
- id: MCP-010
  claim: The package is published as spelunk-mcp, the command is spelunk, and `uvx --from spelunk-mcp
    spelunk` runs it with no clone.
  source: README.md#install-and-run
  mode: behavioral
  falsifier: The documented uvx invocation fails, or the entry point is named differently.
  status: partial
  covered_by:
  - tests/test_contracts.py::TestPackaging::test_entry_point_is_declared_and_importable
  - tests/test_contracts.py::TestPackaging::test_readme_documents_the_published_name
  - tests/test_version.py::test_dunder_version_matches_pyproject
  gap: 'The declared console-script target resolves and is callable, and the published name is pinned.
    NOT covered: an actual wheel build installed into a clean venv, the only way to catch a packaging
    (rather than metadata) break. Belongs in release CI.'
- id: MCP-011
  claim: __version__ matches the version declared in pyproject.toml.
  source: repo convention
  mode: behavioral
  falsifier: The reported server version disagrees with the published package version.
  status: verified
  covered_by:
  - tests/test_version.py::test_dunder_version_matches_pyproject
- id: MCP-012
  claim: __init__.py files do not re-export submodules — import from the submodule directly.
  source: CLAUDE.md#architecture
  mode: behavioral
  falsifier: A re-export appears, making the documented import style optional and the boundary meaningless.
  status: verified
  covered_by:
  - tests/test_contracts.py::TestNoSubmoduleReExports::test_engine_submodules_are_not_available_from_the_package
  - tests/test_contracts.py::TestNoSubmoduleReExports::test_the_documented_import_path_works
  note: 'Precise reading: spelunk/core/__init__.py DOES re-export names from types/guard, but no engine
    SUBMODULE (duck, sources, apifetch, openapi) and not DuckSession — so the documented import style
    is mandatory, as claimed.'
- id: MCP-013
  claim: 'Tools run on worker threads, and DuckSession.open() calls _warm_native_imports() on the
    main thread because a first-time numpy/pandas import on a worker thread deadlocks on Windows —
    hanging the tool call forever.

    '
  source: CLAUDE.md#tools-run-on-worker-threads
  mode: behavioral
  falsifier: A first tool call from a worker thread under a running asyncio loop hangs.
  status: partial
  covered_by:
  - tests/test_contracts.py::TestNativeImportsAreWarmed::test_open_imports_them_before_any_tool_runs
  - tests/test_contracts.py::TestNativeImportsAreWarmed::test_a_tool_call_on_a_worker_thread_completes
  gap: 'The MECHANISM is pinned now: a fresh interpreter asserts numpy is not loaded before DuckSession.open()
    and is loaded after it, and a tool call is driven off the event loop under a timeout. The HANG
    ITSELF is deliberately not reproduced — a test that deadlocks would hang the suite — so a regression
    that removed warming while some other import happened to pull numpy in first would still pass.
    Closing that needs a Windows CI job running the original conditions in a subprocess with a hard
    kill.'
- id: MCP-014
  claim: A .mcp.json wires Claude Code to a local source (paths are machine-specific; edit before
    use).
  source: CLAUDE.md#running-the-server
  mode: behavioral
  falsifier: The checked-in .mcp.json is malformed, so the documented wiring cannot work.
  status: verified
  covered_by:
  - tests/test_contracts.py::TestCheckedInMcpConfig::test_mcp_json_is_well_formed
  - tests/test_contracts.py::TestCheckedInMcpConfig::test_configured_source_specs_are_classifiable
  note: Each --source in the example config must be a spec detect_kind can classify — a broken example
    is a first-run failure.
- id: MCP-015
  claim: '--transport selects how the protocol is carried: ''stdio'' (the default, unchanged) or ''http'',
    which serves streamable HTTP on --host/--port/--http-path (127.0.0.1:8080/mcp by default). Both
    transports expose the SAME tool and resource surface over the same DuckSession.

    '
  source: CLAUDE.md#running-the-server
  mode: behavioral
  falsifier: 'Omitting --transport stops speaking stdio (a breaking change for command-launched
    clients); or --transport http binds nothing, serves a different tool set, or cannot run a query
    that a stdio server can.'
  status: verified
  covered_by:
  - tests/test_cli.py::TestHttpTransport::test_same_surface_and_a_cross_source_query_over_http
  - tests/test_cli.py::TestHttpTransport::test_bound_url_is_announced_on_stderr
  - tests/test_cli.py::TestHttpTransport::test_a_non_default_http_path_is_where_the_endpoint_lands
  - tests/test_cli.py::TestHttpTransport::test_http_path_without_a_leading_slash_is_refused
  - tests/test_cli.py::TestStdioTransport::test_registered_surface_is_exactly_the_documented_one
  note: 'The HTTP test asserts set EQUALITY against the same DOCUMENTED_TOOLS the stdio test uses, so
    the two transports cannot drift apart in surface. It also lists RESOURCES: the claim says "tool and
    resource surface", and a tools-only assertion would let a transport serve half of it and still pass.
    The stdio tests are unchanged and pass no --transport, which is what pins stdio as the default.
    --http-path is exercised at a NON-default value, so forwarding it to FastMCP (not merely printing
    it) is what the test proves; a value without a leading slash is refused at parse time.

    Deliberately NOT covered: clean shutdown in HTTP mode. uvicorn returns from run() on SIGINT/SIGTERM
    so the workspace-reclaim finally does fire, but a portable test needs a graceful signal that Windows
    subprocess.terminate() does not send. The startup GC sweep reclaims the dir either way.'
- id: MCP-016
  claim: 'The HTTP transport screens requests for DNS rebinding: an Origin header, when present, must
    name the endpoint, and on a loopback bind the Host header must too — otherwise 403. A client that
    sends no Origin (every normal MCP client) is unaffected. --allowed-origin adds authorities.

    '
  source: CLAUDE.md#running-the-server
  mode: invariant
  falsifier: 'A request carrying a foreign Origin (or, on a loopback bind, a Host naming somewhere
    else) reaches the MCP layer instead of being refused; or the guard refuses a client that sends no
    Origin, or one naming the endpoint itself, or one named by --allowed-origin.'
  status: verified
  covered_by:
  - tests/test_cli.py::TestHttpOriginGuard::test_a_foreign_origin_is_refused
  - tests/test_cli.py::TestHttpOriginGuard::test_a_rebound_host_is_refused
  - tests/test_cli.py::TestHttpOriginGuard::test_a_normal_client_sending_no_origin_is_untouched
  - tests/test_cli.py::TestHttpOriginGuard::test_the_endpoints_own_origin_is_allowed
  - tests/test_cli.py::TestHttpOriginGuard::test_allowed_origin_opens_a_named_extra
  - tests/test_cli.py::TestEndpointAuthorities::test_the_bound_host_always_names_itself
  - tests/test_cli.py::TestEndpointAuthorities::test_loopback_aliases_come_too
  - tests/test_cli.py::TestEndpointAuthorities::test_an_ipv6_bind_is_bracketed
  - tests/test_cli.py::TestEndpointAuthorities::test_a_non_loopback_bind_names_only_itself_and_extras
  note: 'The bound host ALWAYS names itself: 127.0.0.0/8 is entirely loopback, so an allowed set
    built only from the standard aliases would enable check_host and then 403 the endpoint''s own
    clients on `--host 127.0.0.2`. That case is asserted at unit level because binding a non-.1
    loopback address is not portable enough to drive as a subprocess.

    This guard is OURS (spelunk.mcp.server._OriginGuard), not FastMCP''s. FastMCP 3.4.2 ships no
    host_origin_protection — the string appears nowhere in the package — so an earlier draft of the
    docs claiming it was simply wrong, which is what this claim now pins. The negative tests assert
    403 specifically; the positive ones assert "not 403" rather than 200, because a raw ping with no
    MCP session legitimately draws a 400 from the layer BELOW the guard, and asserting 200 there would
    couple the claim to the handshake instead of the guard. If FastMCP later ships its own guard,
    delete ours rather than stacking them, and re-point this claim.'
