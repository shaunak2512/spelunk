area: Workspace lifecycle — durability, per-process isolation, GC, out-of-core
prefix: WSP
claims:

- id: WSP-001
  claim: The workspace is a real DuckDB file on disk, so results are durable and survive a reopen.
  source: CLAUDE.md#key-concepts
  mode: behavioral
  falsifier: Results vanish when a session is reopened on the same directory.
  status: verified
  covered_by:
    - tests/test_duck.py::TestPersistence::test_durable_workspace_survives_reopen

- id: WSP-002
  claim: >
    Each server process gets its own durable workspace at <session-dir>/<pid>-<rand>/workspace.duckdb,
    so many concurrent servers never collide and never contend for the single-writer lock.
  source: CLAUDE.md#running-the-server
  mode: behavioral
  falsifier: Two concurrent sessions share a file, or one blocks the other.
  status: verified
  covered_by:
    - tests/test_duck.py::TestPersistence::test_per_process_workspaces_are_durable_and_isolated

- id: WSP-003
  claim: "--shared-workspace restores one <session-dir>/workspace.duckdb; concurrent servers then contend, and all but the first fall back to ephemeral."
  source: server.py#--shared-workspace
  mode: behavioral
  falsifier: A second server on a locked shared workspace crashes instead of falling back.
  status: verified
  covered_by:
    - tests/test_duck.py::TestPersistence::test_locked_workspace_falls_back_to_ephemeral

- id: WSP-004
  claim: "DuckSession.open(session_dir=None) is an ephemeral private temp workspace."
  source: CLAUDE.md#running-the-server
  mode: behavioral
  falsifier: A session_dir-less session writes into the CWD, or is not private.
  status: unverified
  covered_by: []
  gap: >
    The default library entry point. Nothing asserts where it lands or that it is cleaned up —
    a leak here silently fills a temp dir on every run.

- id: WSP-005
  claim: >
    The GC sweep keeps the --keep-workspaces N most recent per-process workspaces (default 3,
    including the one just created) and reclaims older subdirs with no live owner.
  source: CLAUDE.md#workspace-gc
  mode: behavioral
  falsifier: More than N survive, or the just-created workspace is reclaimed.
  status: verified
  covered_by:
    - tests/test_duck.py::TestPersistence::test_per_process_keeps_only_n_recent_workspaces

- id: WSP-006
  claim: >
    Empty workspaces are reclaimed even inside the keep window — a DB with no tables outside the
    reserved schemas and no artifacts beyond a 0-byte tool log is garbage (MCP reconnect churn).
  source: CLAUDE.md#workspace-gc
  mode: behavioral
  falsifier: Reconnect churn accumulates empty <pid>-<rand> dirs indefinitely.
  status: verified
  covered_by:
    - tests/test_duck.py::TestPersistence::test_sweep_reclaims_empty_workspaces_within_keep_window

- id: WSP-007
  claim: >
    Liveness is the DuckDB file lock: the sweep probes each candidate with a read-write connect —
    a live server holds it and is skipped; a crashed one opens and is deleted.
  source: CLAUDE.md#workspace-gc
  mode: invariant
  falsifier: A workspace belonging to a RUNNING server is deleted. (Destructive if false.)
  status: partial
  covered_by:
    - tests/test_duck.py::TestPersistence::test_per_process_sweep_skips_live_workspace
  gap: >
    Single-holder, same-machine, happy path. Untested: a stale lock from a hard kill, a
    workspace on a filesystem with weak locking (network share), and the documented
    same-process blind spot. This is the one claim in the register whose failure DESTROYS USER
    DATA, and it rests on one test.

- id: WSP-008
  claim: On clean shutdown a no-work server deletes its own dir immediately, after releasing the tool-log handler first (Windows).
  source: CLAUDE.md#workspace-gc
  mode: behavioral
  falsifier: A server that handled no calls leaves its dir behind, or rmtree fails on an open handle.
  status: verified
  covered_by:
    - tests/test_duck.py::TestPersistence::test_close_reclaims_own_empty_per_process_workspace

- id: WSP-009
  claim: Dirs younger than a 60s grace window are never touched (a sibling may be mid-startup, lock not yet held).
  source: CLAUDE.md#workspace-gc
  mode: behavioral
  falsifier: A workspace created seconds ago by a starting server is reclaimed.
  status: unverified
  covered_by: []
  gap: >
    The grace window is the ONLY protection during the startup race the previous claim cannot
    cover. Testable with a fabricated dir and a patched clock.

- id: WSP-010
  claim: "--keep-workspaces 0 (or <=0) disables the sweep entirely, empty-dir reclamation included."
  source: CLAUDE.md#workspace-gc
  mode: behavioral
  falsifier: A zero/negative value still deletes something.
  status: unverified
  covered_by: []
  gap: The documented escape hatch for anyone who cannot afford deletion — and it is untested.

- id: WSP-011
  claim: >
    Every query — and every successful step of a batch — ends with a CHECKPOINT of the workspace
    catalog, folding the WAL into workspace.duckdb immediately.
  source: CLAUDE.md#key-concepts
  mode: behavioral
  falsifier: The WAL grows unbounded across queries, so a kill loses recent results.
  status: verified
  covered_by:
    - tests/test_duck.py::TestPersistence::test_query_checkpoints_wal_into_workspace_file

- id: WSP-012
  claim: >
    The checkpoint is best-effort (a no-op/abort is swallowed — data is already durable in the
    WAL) and targets the workspace catalog BY NAME, so read-only attached sources are untouched.
  source: CLAUDE.md#key-concepts
  mode: behavioral
  falsifier: A checkpoint failure propagates as a query error, or a checkpoint touches an attached source.
  status: unverified
  covered_by: []
  gap: >
    Neither half is asserted. The swallow path is what keeps a concurrent-read scenario from
    failing user queries; the by-name targeting is what keeps a read-only source safe.

- id: WSP-013
  claim: >
    Out-of-core: sources are read on demand with pushdown and buffering operators spill to
    temp_directory, so a source larger than RAM is the normal case, not a failure.
  source: CLAUDE.md#key-concepts
  mode: quantitative
  falsifier: A join/aggregate over a source much larger than memory_limit OOMs instead of spilling.
  status: unverified
  covered_by: []
  gap: >
    A headline claim with zero coverage. Needs a generated Parquet set several times a small
    memory_limit, running an aggregate and a spilling join, asserting completion, correctness
    against a known answer, and that temp_directory was actually used.

- id: WSP-014
  claim: "--memory-limit, --temp-dir and --max-temp-size are honoured as guards."
  source: README.md#install-and-run
  mode: behavioral
  falsifier: A configured limit is not applied to the session, so the guard is decorative.
  status: unverified
  covered_by: []
  gap: >
    No test reads back the DuckDB settings after open(). Cheap to close (query duckdb_settings())
    and it is the precondition for the out-of-core claim above being testable at all.

- id: WSP-015
  claim: Each run gets a fresh subdir — isolation, not a shared store across runs.
  source: CLAUDE.md#running-the-server
  mode: behavioral
  falsifier: A new process reuses a previous run's workspace and inherits its results.
  status: verified
  covered_by:
    - tests/test_duck.py::TestPersistence::test_per_process_workspaces_are_durable_and_isolated

- id: WSP-016
  claim: The GC's liveness detection is cross-process only — two sessions in one process share DuckDB's cached instance, so a sweep cannot detect an in-process holder.
  source: CLAUDE.md#workspace-gc
  mode: behavioral
  falsifier: The stated limitation is wrong in either direction (it does detect in-process, or it damages an in-process holder).
  status: unverified
  covered_by: []
  gap: >
    A documented LIMITATION, which deserves a test as much as a feature: it pins the boundary
    so a future DuckDB change that alters instance caching is caught rather than assumed benign.
