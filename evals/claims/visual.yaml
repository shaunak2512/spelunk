area: >
  The `visual` tool and the Vega-Lite / MCP Apps rendering layer — what gets drawn, what must
  never be drawn silently, and the boundary that keeps a view from becoming a result.

  This file REPLACES show.yaml. `show` (a fixed set of Prefab component kinds) was removed in
  favour of `visual` (an agent-authored Vega-Lite spec), so its claims were re-derived rather
  than marked refuted: the behaviour they asserted is mostly intact, but the mechanism changed.
  Four claims were dropped outright because the thing they described no longer exists —
  SHOW-009 (Prefab's construction-time container trap), SHOW-010 (the profile/catalog/lineage
  view kinds), SHOW-013 (the client-side measure picker) and SHOW-017 (the Lineage tab). That
  is a deliberate scope reduction, not a silent loss: the picker and the tab were client-side
  state on a Prefab component tree, and re-expressing them as Vega-Lite `params` and a `concat`
  is future work, not a shipped behaviour.
prefix: VIS
claims:

- id: VIS-001
  claim: >
    `visual` is read-only over the DATA: it creates NO result and records NO lineage node, in
    every mode including `save_as`. A view is not a result. What `save_as` persists is a chart
    DEFINITION in the reserved meta schema — the same kind of thing a lineage row is.
  source: CLAUDE.md#tool-surface
  mode: invariant
  falsifier: >
    A `visual` call leaves a new table in the flow, adds a row to _spelunk_meta.lineage, or
    brings a new FLOW into existence.
  status: verified
  covered_by:
  - tests/test_visual.py::TestVisualTool::test_creates_no_result_and_no_lineage_row
  - tests/test_visual.py::TestVisualTool::test_unknown_flow_is_not_provisioned
  - tests/test_visual.py::TestRowsForDisplay::test_reads_without_creating_anything
  - tests/test_visual_store.py::TestSaveAs::test_creates_no_result_and_no_lineage_row
  - tests/test_visual_store.py::TestModeRefusals::test_an_unknown_flow_is_refused_not_provisioned
  note: >
    The load-bearing claim of the whole feature, and it survived the Prefab-to-Vega swap
    unchanged. The flow-provisioning half is the one that hid a real leak under `show`:
    `session.catalog(flow)` and `session.profile(...)` both CREATE SCHEMA IF NOT EXISTS, so a
    typo'd flow was PROVISIONED by a display path and `catalog` then listed it — "nothing in
    catalog" was false in the one way it is observable. `_require_existing_flow` still guards
    it, and `visual` now touches neither of those methods, so the surface for the bug is
    smaller than it was.

- id: VIS-002
  claim: >
    Past its row cap, `visual` ERRORS rather than truncating — a silently shortened chart is a
    picture that misstates the data. The error names the real row count and the way out.
  source: CLAUDE.md#tool-surface
  mode: behavioral
  falsifier: >
    A result larger than the cap renders anyway, with rows quietly dropped and no indication in
    the reply that anything is missing.
  status: verified
  covered_by:
  - tests/test_visual.py::TestVisualTool::test_refuses_rather_than_truncates_past_the_row_cap
  - tests/test_visual.py::TestRowsForDisplay::test_refuses_past_the_row_cap_instead_of_truncating
  - tests/test_visual.py::TestRowsForDisplay::test_cell_cap_catches_a_wide_result_the_row_cap_misses
  note: >
    The cap moved UP (200 for a Prefab chart, VEGA_MAX_ROWS=5000 now) because Vega-Lite holds
    the rows in the browser and can aggregate or bin client-side, so legibility is no longer
    bounded by the row count the way a fixed bar chart's was. The stance did not move: refuse,
    do not truncate. SHOW-003 — charts capping far lower than tables because the limit is
    legibility, not payload size — no longer holds and was dropped with the `table` kind.

- id: VIS-003
  claim: >
    `visual` returns BOTH halves of an MCP result: a JSON text summary the model reads and the
    hydrated Vega-Lite spec a UI host renders. The model is never handed a placeholder.
  source: CLAUDE.md#key-concepts
  mode: invariant
  falsifier: >
    A `visual` call returns only structuredContent, or returns the FastMCP `app=True`
    placeholder string in place of the summary, leaving the model unable to reason about what
    it just displayed.
  status: verified
  covered_by:
  - tests/test_visual.py::TestVisualTool::test_returns_both_halves
  note: >
    This is why `query` was never made an app tool: FastMCP replaces an app tool's
    model-visible content with the literal "[Rendered Prefab UI]". Building a ToolResult by
    hand keeps both audiences served, and it is what lets a text-only host degrade by simply
    ignoring structuredContent rather than needing a host-detection branch.

- id: VIS-004
  claim: >
    The text half mirrors `query`'s sample contract — every row when the result is small on
    both axes (complete: true), otherwise a short head — and reports only the fields the spec
    actually plots, not every column of the result.
  source: CLAUDE.md#tool-surface
  mode: behavioral
  falsifier: >
    A small result comes back as a truncated head, or the summary claims columns are on screen
    that the spec never encodes.
  status: verified
  covered_by:
  - tests/test_visual.py::TestVisualTool::test_summary_mirrors_query_sample_contract
  - tests/test_visual.py::TestVisualTool::test_summary_reports_only_the_plotted_fields
  note: >
    The `fields` half is new with `visual` and it matters more than it did under `show`: a
    Vega-Lite spec can read a two-column subset of a forty-column result, so reporting
    `columns` alone would overstate what the reader is looking at. Same obligation the old
    interactive picker had when it reported `showing`.

- id: VIS-005
  claim: >
    `visual` is registered unconditionally — it needs no optional Python package, because a
    Vega-Lite spec is JSON and the app page is a string.
  source: CLAUDE.md#tool-surface
  mode: invariant
  falsifier: >
    A lean install (no extras) starts a server whose tool list is missing `visual`.
  status: verified
  covered_by:
  - tests/test_cli.py::TestStdioTransport::test_visual_is_always_registered
  note: >
    Inverts SHOW-006, which claimed the opposite as a feature: `show` was absent without
    prefab-ui, so a lean install silently lost the display surface. Dropping the Python
    rendering dependency removed the whole conditional, and the [ui] extra now carries only the
    fastmcp floor. The test asserts presence rather than deriving the expectation from an
    import guard, so there is no way for the implementation and the expectation to fail
    together.

- id: VIS-006
  claim: >
    The tool carries BOTH resource-URI meta keys — the nested _meta.ui.resourceUri (current MCP
    Apps wire form, what FastMCP writes) and the deprecated flat _meta["ui/resourceUri"] (what
    Claude Desktop / claude.ai actually key on) — pointing at a readable ui:// resource.
  source: CLAUDE.md#architecture
  mode: invariant
  falsifier: >
    The registered tool lacks either meta key, or the URI it names cannot be read back from the
    server as a resource.
  status: verified
  covered_by:
  - tests/test_visual.py::TestRegistration::test_visual_is_registered_with_ui_metadata
  - tests/test_visual.py::TestRegistration::test_app_resource_is_readable
  note: >
    Revised from "nested key is what makes a host render": that was refuted in the field.
    Claude ignores the nested key, so a FastMCP tool carrying only it gets its resource
    fetched and its call answered while the iframe silently never mounts — the official
    ext-apps SDK's registerAppTool emits both keys for exactly this reason, and its example
    servers rendering while FastMCP servers didn't is what located the bug. Drop the flat key
    only when Claude honours the nested form. A tool pointing at a resource the server does
    not serve fails the same silent way — the host fetches, gets nothing, renders an empty
    frame.

- id: VIS-007
  claim: >
    Every `field` a spec names must be a real column of the result, or one the spec's own
    transforms produce. A field that is neither is an ERROR — a chart is never silently plotted
    against a column that does not exist.
  source: CLAUDE.md#tool-surface
  mode: behavioral
  falsifier: >
    A spec encoding a misspelled field renders as an empty or partial chart instead of raising,
    or a legitimate `calculate`/`aggregate`/`fold` output is rejected as a missing column.
  status: verified
  covered_by:
  - tests/test_visual.py::TestValidateSpec::test_rejects_a_field_that_is_not_a_column
  - tests/test_visual.py::TestValidateSpec::test_allows_a_field_a_transform_invents
  - tests/test_visual.py::TestValidateSpec::test_allows_fold_output_fields
  - tests/test_visual.py::TestVisualTool::test_bad_field_errors_before_anything_renders
  - tests/test_visual.py::TestValidateSpec::test_a_column_named_only_in_an_expression_is_out_of_scope
  - tests/test_visual.py::TestValidateSpec::test_rejects_a_misspelled_fold_input
  - tests/test_visual.py::TestValidateSpec::test_rejects_a_misspelled_pivot_input
  - tests/test_visual.py::TestValidateSpec::test_allows_a_pivot_output_column_that_only_the_data_can_name
  - tests/test_visual.py::TestValidateSpec::test_allows_a_custom_category_order
  - tests/test_visual.py::TestValidateSpec::test_a_custom_fold_as_replaces_the_default_output_names
  note: >
    The successor to SHOW-008, and the sharpest reason a declarative spec was chosen over
    agent-authored JSX: the artifact is data, so it can be checked BEFORE it draws. Vega-Lite's
    own failure mode here is silent — a missing encoding field yields a blank or subtly wrong
    chart with no error anywhere — which is exactly the mis-plot this refuses to ship. The
    both-directions falsifier is deliberate: a guard that rejected transform outputs would be
    worse than no guard, because it would push an agent away from transforms entirely.
    SCOPE, stated so it cannot drift, and set by that asymmetry: an input the guard cannot see
    is a typo missed, an output it cannot see is a working chart refused. So the produced side
    stays permissive, and the input side reads only keys that can hold nothing BUT a column name
    — `field`, the `fold`/`flatten`/`groupby` lists, and `pivot` with its `value`. Two keys are
    excluded for failing that test and both were live false positives: an encoding's `sort` array
    holds the category VALUES to order an axis by, so reading them as columns refused every
    hand-ordered axis (`sort: ["Jan", "Feb", "Mar"]` reported the months as missing columns),
    and `stack` holds `"normalize"`.
    Two blind spots remain, both deliberate. A column named only inside an expression string
    (`{"filter": "datum.revnue > 0"}`) is unreachable, because Vega-Lite INVENTS field names
    implicitly (`sum_revenue`, `bin_maxbins_10_x`, `yearmonth_date`) and post-aggregation
    expressions legitimately reference them — demanding every extracted `datum.<name>` would trip
    this claim's own second falsifier. And everything downstream of a `pivot` is unknowable by
    construction: a pivot mints one column per distinct VALUE of its input, so the names exist in
    the data, not the grammar. Enforcing them refused the ordinary pivot chart. What a pivot
    READS is still checked. Both holes reach the `fields` VIS-024 compares against, since the
    drift check reads the same set — and both are pinned by tests, so closing either forces a
    decision here rather than a silent change.

- id: VIS-008
  claim: >
    `data.url` is refused anywhere in a spec, and a spec may not carry its own top-level
    `data` — every row comes from a saved result the server injects.
  source: CLAUDE.md#key-concepts
  mode: invariant
  falsifier: >
    A spec with `data: {url: ...}` (at the top level or nested in a layer/concat) is accepted
    and reaches the renderer, making the viewer's browser fetch a host the server never saw.
  status: verified
  covered_by:
  - tests/test_visual.py::TestValidateSpec::test_rejects_data_url
  - tests/test_visual.py::TestValidateSpec::test_rejects_data_url_nested_in_a_layer
  - tests/test_visual.py::TestValidateSpec::test_rejects_a_top_level_data_key
  - tests/test_visual.py::TestValidateSpec::test_image_mark_url_encoding_is_not_mistaken_for_data_url
  note: >
    `data.url` is the one genuine egress channel in an otherwise declarative artifact, and it
    is the reason the app page declares no connect_domains: both halves of the same stance.
    The check is scoped to blocks reached through a `data` key rather than hunting for `url`
    anywhere, because the image mark takes a legitimate `url` ENCODING channel — a false
    positive there would reject a valid spec, which is its own failure.

- id: VIS-009
  claim: >
    The stored/authored spec carries no data; the server hydrates it with inline `values` at
    call time, so the renderer needs no round trip to draw.
  source: CLAUDE.md#key-concepts
  mode: invariant
  falsifier: >
    The payload sent to the host omits the rows, forcing the app to call back through the
    tools/call proxy before it can render anything.
  status: verified
  covered_by:
  - tests/test_visual.py::TestHydrate::test_injects_rows_as_inline_values
  - tests/test_visual.py::TestHydrate::test_does_not_mutate_the_input_spec
  note: >
    The rule for anything added to a view: if a control would need a round trip, it does not
    belong on a view. Hydrating server-side is what makes that affordable — the spec stays
    portable and data-free for authoring, and the payload is self-contained for rendering. It
    is also what will make a stored visual artifact replay cleanly against refreshed data
    without being re-authored.

- id: VIS-010
  claim: >
    The app page needs no `script-src 'unsafe-eval'`: Vega's expressions run through the
    AST interpreter (`ast: true`), not the Function constructor.
  source: CLAUDE.md#key-concepts
  mode: invariant
  falsifier: >
    The page omits `ast: true`, so a deny-by-default sandbox CSP blocks expression compilation
    and every chart with a signal, selection or sized axis fails to render.
  status: verified
  covered_by:
  - tests/test_visual.py::TestAppPage::test_page_uses_the_csp_safe_expression_interpreter
  note: >
    Worth stating as a claim because it is invisible until it breaks, and because it was the
    decisive technical argument for Vega-Lite over agent-authored JSX: JSX needs an in-browser
    transpiler and therefore `unsafe-eval`, which is the directive that turns injected data
    into a code-execution path. A declarative spec needs neither.

- id: VIS-011
  claim: >
    `visual` serves its own ui:// app resource and declares the CSP ON THE RESOURCE, naming
    the ONE CDN host the page loads (jsDelivr — the transport is inline), at pinned versions.
  source: CLAUDE.md#key-concepts
  mode: invariant
  falsifier: >
    The CSP is declared on the tool instead of the resource (yielding a resource with no
    policy), the bundle host is missing from resource_domains, an extra origin crept in, or a
    version is floating.
  status: verified
  covered_by:
  - tests/test_visual.py::TestAppPage::test_csp_declares_the_bundle_host_and_nothing_else
  - tests/test_visual.py::TestAppPage::test_csp_grants_no_connect_domains
  - tests/test_visual.py::TestAppPage::test_page_pins_every_bundle_version
  - tests/test_visual.py::TestAppPage::test_page_is_deterministic
  note: >
    Inherits the hard-won part of SHOW-014: taking over the resource means FastMCP no longer
    attaches a CSP for you, and declaring it on the TOOL yields a resource with no policy at
    all — the host blocks every bundle and the frame stays blank with no error to debug. The
    pins matter for the same reason prefab-ui was pinned exactly: the version selects the
    JavaScript users' browsers fetch, not just what the server imports. `connect_domains` is
    asserted ABSENT, which is the CSP half of VIS-008.

- id: VIS-012
  claim: >
    A host that strips `structuredContent` from the tool-result it forwards (Claude Desktop,
    modelcontextprotocol/ext-apps#696) still renders: the app captures the arguments from the
    intact tool-input notification and re-fetches through the tools/call proxy.
  source: CLAUDE.md#key-concepts
  mode: behavioral
  falsifier: >
    On a host that strips structuredContent, the view stays on its loading message forever with
    no recovery attempt and no diagnosis.
  status: partial
  covered_by:
  - tests/test_visual.py::TestAppPage::test_page_has_a_static_fallback_naming_the_bundle_hosts
  - tests/test_visual_runtime.py::TestMissingStructuredContent::test_re_fetches_through_the_tool_proxy_and_draws
  - tests/test_visual_runtime.py::TestMissingStructuredContent::test_says_so_when_there_are_no_arguments_to_re_fetch_with
  - tests/test_visual_runtime.py::TestMissingStructuredContent::test_does_not_loop_when_the_re_fetch_also_comes_back_empty
  gap: >
    The runtime tests DRIVE the recovery branch under node (re-fetches once, reports when it
    cannot, never loops), but against a stub transport — no test speaks to a real stripping
    host, so the claim that the host's tools/call proxy is unaffected rests on field
    observation only.
  note: >
    Much smaller than the Prefab-era shim, which had to monkey-patch window.addEventListener
    to reach inside a transport it did not own. The transport is now OURS (the inline
    `window.SpelunkApp`, raw `ui/` postMessage — the ext-apps SDK's CDN module import died
    silently on Claude Desktop and was removed), so `ontoolinput` and `callServerTool` are a
    dozen honest lines guarded by `if (!structuredContent && !isError)`. Re-calling is sound
    only because `visual` is idempotent and read-only. Temporary: `grep -rn "ext-apps#696"`
    finds every line to delete.

- id: VIS-013
  claim: >
    `visual` declares an outputSchema describing its **structuredContent** — the `{spec: ...}`
    envelope the host reads — and every payload it returns validates against it.
  source: CLAUDE.md#tool-surface
  mode: invariant
  falsifier: >
    The declared schema describes something other than structuredContent (the text summary, say),
    or a returned payload fails validation against it. Either way a host that honours the schema
    rejects the call and renders nothing.
  status: verified
  covered_by:
  - tests/test_visual.py::TestOutputSchema::test_structured_content_validates_against_the_declared_schema
  - tests/test_visual.py::TestOutputSchema::test_schema_describes_the_spec_envelope_not_the_summary
  - tests/test_visual.py::TestRegistration::test_declared_output_schema_accepts_the_real_payload
  note: >
    Inherited from SHOW-016 and immediately falsified in the field: the schema was first written
    to describe the TEXT SUMMARY, while structuredContent carries `{spec: ...}`. FastMCP requires
    structured_content whenever an output_schema exists (tools/base.py:313) and Claude Desktop
    validates it, so every call failed with "missing a required displayed property" and nothing
    rendered. The local test passed throughout because it validated the summary — the very object
    the schema was wrongly written for. That is the lesson worth keeping: a contract test that
    picks its own subject can agree with a bug. The third node id closes it by reading the schema
    off the REGISTERED tool and validating an actual `call_tool` result against it, which is what
    a host does and the only version that can catch this class of mismatch.

- id: VIS-014
  claim: >
    A `visual` call logs one JSON line summarising the view — not the hydrated spec.
  source: CLAUDE.md#running-the-server
  mode: invariant
  falsifier: >
    The tool log contains the plotted rows, turning a usage log into a data dump.
  status: verified
  covered_by:
  - tests/test_mcp_server.py::TestToolLogging::test_each_call_logs_one_json_line
  note: >
    The hydrated spec carries every plotted row inline, so logging the payload would bury the
    line in data — the same reason `_summarize_result` unwrapped the Prefab component tree.

- id: VIS-016
  claim: >
    Only ONE Vega view is ever alive on the chart element: each embed finalizes the previous one
    and draws are serialized, so a spec carrying `params` selections re-renders instead of dying
    on a duplicate signal name.
  source: CLAUDE.md#key-concepts
  mode: invariant
  falsifier: >
    A second draw (a host theme change, a #696 re-fetch) embeds over a live view, and a spec with
    a selection fails with `Duplicate signal name: "<param>_tuple"` — rendering nothing.
  status: verified
  covered_by:
  - tests/test_visual.py::TestSingleViewPerElement::test_previous_view_is_finalized_before_re_embedding
  - tests/test_visual.py::TestSingleViewPerElement::test_draws_are_serialized
  - tests/test_visual.py::TestSingleViewPerElement::test_theme_change_redraws_only_on_an_actual_theme_change
  note: >
    Found in the field, not by testing. Vega registers a selection's signals (`<name>_tuple` and
    friends) in a per-element namespace, so a second view on the same element collides with the
    first. What makes it nasty is that a spec WITHOUT `params` survives the identical double
    embed silently — so the bug is invisible until an agent writes its first interactive chart,
    which is exactly the expressiveness `visual` exists to offer. Teardown alone is not enough:
    it runs before the first `await`, so two overlapping embeds still race, hence the promise
    chain as well.

- id: VIS-017
  claim: >
    Every script on the app page is parsed by `node --check` in the test suite, in SCRIPT mode
    (.cjs) — boot, transport, and app alike — so a reintroduced top-level `await` (legal only
    in the ES module the page no longer ships) is a test failure, not a blank frame.
  source: tests/test_visual.py
  mode: invariant
  falsifier: >
    A syntax error in a page script ships green, because nothing in the suite parses the
    JavaScript — or the parse runs in module mode, where the classic-script syntax errors that
    matter (top-level await) are legal.
  status: verified
  covered_by:
  - tests/test_visual.py::TestAppScriptIsValidJavaScript::test_boot_script_parses
  - tests/test_visual.py::TestAppScriptIsValidJavaScript::test_transport_script_parses
  - tests/test_visual.py::TestAppScriptIsValidJavaScript::test_app_script_parses_as_a_classic_script
  - tests/test_visual.py::TestAppScriptIsValidJavaScript::test_the_parse_check_actually_fails_on_broken_source
  - tests/test_visual.py::TestAppScriptIsValidJavaScript::test_classic_check_rejects_top_level_await
  note: >
    The suite asserted on the page as a STRING and never as code, which is how two shipped bugs
    (the outputSchema mismatch, the duplicate-signal crash) both passed locally. Parsing is not
    execution and will not catch a logic error, but it closes the whole "the script never ran"
    class for free. .cjs is load-bearing: modern node auto-detects module syntax in a bare .js,
    which would silently re-legalize top-level await. The guard-the-guard ids prove `--check`
    actually fails on broken source and on top-level await, so the checks cannot go vacuous the
    way the outputSchema test did. Skips when node is absent.

- id: VIS-018
  claim: >
    The app page ships NO ES modules and no ext-apps SDK: it speaks raw `ui/` JSON-RPC over
    postMessage through an inline transport that ignores any message whose source is not
    `window.parent` and correlates `tools/call` responses by request id.
  source: CLAUDE.md#architecture
  mode: invariant
  falsifier: >
    A `type="module"` script reappears on the page (a failed module import aborts silently —
    the SDK-built page never completed the handshake on Claude Desktop); or the transport
    accepts a notification or a `tools/call` answer postMessage'd by a frame other than the
    host, letting a hostile frame feed the view a payload.
  status: verified
  covered_by:
  - tests/test_visual.py::TestAppPage::test_every_script_is_classic_and_boot_runs_first
  - tests/test_visual_runtime.py::TestTransportHandshake::test_connect_performs_the_documented_handshake
  - tests/test_visual_runtime.py::TestTransportHandshake::test_notifications_route_to_their_handlers
  - tests/test_visual_runtime.py::TestTransportHandshake::test_call_server_tool_correlates_request_and_response
  - tests/test_visual_runtime.py::TestTransportHandshake::test_messages_not_from_the_host_are_ignored
  - tests/test_visual_runtime.py::TestTransportHandshake::test_a_jsonrpc_error_rejects_the_pending_request
  note: >
    The dialect (ui/initialize -> initialized -> tool-input/tool-result, protocol 2026-01-26)
    is the one the develop-ui recovery shim verified message-by-message against Claude, and the
    rewrite that made minimal_vega_server's chart_raw render. The SDK spoke the same method
    names; what killed it was the DELIVERY — one CDN ES-module import, whose failure mode is
    total silence. The source-identity check is the transport's security property and gets its
    own spoofing test.

- id: VIS-019
  claim: >
    A selection param at the top level of a multi-view spec (layer/concat/facet/repeat) is
    refused server-side, because Vega-Lite only allows selections inside unit specs and the
    compiled chart dies in the renderer with `Duplicate signal name: "<name>_tuple"` — after
    the tool has already returned success, invisibly to the agent. Params inside a unit, and
    variable (non-select) params anywhere, pass.
  source: spelunk/mcp/vega.py
  mode: behavioral
  falsifier: >
    validate_spec accepts a layered spec with a top-level select param (the chart then renders
    as an error card only the human sees), or over-blocks the legal placements — a selection
    inside a layer entry, a selection on a unit spec, or a top-level variable param.
  status: verified
  covered_by:
  - tests/test_visual.py::TestValidateSpec::test_rejects_a_top_level_selection_param_on_a_layered_spec
  - tests/test_visual.py::TestValidateSpec::test_allows_selection_params_inside_the_layer_unit
  - tests/test_visual.py::TestValidateSpec::test_allows_a_top_level_selection_param_on_a_unit_spec
  - tests/test_visual.py::TestValidateSpec::test_allows_a_top_level_variable_param_on_a_layered_spec
  note: >
    Found in the field on the first agent-authored interactive layered chart. Reproduced
    headlessly (vega-lite compile + vega parse under node) on 5.21.0, 5.23.0 AND 6.4.3 — a
    single-layer spec with one top-level select param fails on the FIRST compile — so this is
    a grammar limitation, not a version bug, and refusing loudly beats silently relocating the
    params (which for a multi-layer spec would mean guessing the owning unit). The `visual`
    tool description teaches the placement at authoring time; this refusal teaches it at
    failure time with the fix named.

- id: VIS-020
  claim: >
    The visual store REPLACES rather than appends. Re-authoring a chart under the same name
    leaves exactly one row in _spelunk_meta.visuals — definitions, not versions.
  source: CLAUDE.md#key-concepts
  mode: invariant
  falsifier: >
    Saving twice under one name leaves two rows, or a version column appears and the read path
    has to pick a winner.
  status: verified
  covered_by:
  - tests/test_visual_store.py::TestSaveAs::test_saving_replaces_rather_than_appends
  note: >
    Deliberately the same semantics as `_record_lineage`, and deliberately NOT the append-only
    version table an earlier draft specified. Version history was cut because the case for it —
    an agent diffing its own iterations — is an untested guess about agent behaviour, while the
    cost is concrete in four places (a QUALIFY on every read, "removes all versions" in drop,
    "latest per name" in catalog, copy-all-versions in replay). The one part that does not
    reverse cheaply is the primary key: DuckDB cannot ALTER one, so adding versions later means
    rebuilding the table rather than the ADD COLUMN IF NOT EXISTS pattern lineage used for
    `description`.

- id: VIS-021
  claim: >
    A stored spec is DATA-FREE. What is persisted is the validated spec, never the hydrated one,
    so no drawn row is written into the meta table.
  source: CLAUDE.md#tool-surface
  mode: invariant
  falsifier: >
    The `spec` column of a stored visual contains a `data` key, or any value from the result it
    was drawn against.
  status: verified
  covered_by:
  - tests/test_visual_store.py::TestSaveAs::test_the_stored_spec_is_data_free
  note: >
    Load-bearing and one line from being wrong. `hydrate()` shallow-copies (`out = dict(spec)`)
    before setting `out["data"]`, which is precisely what leaves `validated` clean and safe to
    persist. Store `hydrated` instead and three things break at once: the spec is no longer
    data-free, the workspace grows by the size of every chart drawn, and a redraw renders the
    rows captured at authoring time while ignoring the live result — the last of which is
    invisible until the data changes.

- id: VIS-022
  claim: >
    A redraw re-runs every guard an authored spec runs — row cap, field validation against the
    result's CURRENT columns, hydration, payload ceiling. The store is not a way around a check.
  source: CLAUDE.md#tool-surface
  mode: behavioral
  falsifier: >
    `visual(saved=...)` draws a chart whose spec references a column the result no longer has,
    or bypasses the row/payload caps because the spec was validated once at authoring time.
  status: verified
  covered_by:
  - tests/test_visual_store.py::TestRedraw::test_re_validates_against_the_current_schema
  - tests/test_visual_store.py::TestRedraw::test_the_row_cap_applies_to_a_redraw_too
  - tests/test_visual_store.py::TestRedraw::test_a_missing_read_target_names_the_result
  - tests/test_visual_store.py::TestRedraw::test_picks_up_data_the_result_did_not_have_at_authoring
  note: >
    This is what makes the store safe to add: it introduces no new trust boundary, because the
    redraw path walks the same four guards. It also delivers the staleness check for free —
    an earlier draft designed a separate reporting structure for "a column was renamed since
    authoring", and re-validation surfaces exactly that, at the moment someone looks, with the
    existing "Spec references column(s) [...]" message.

- id: VIS-023
  claim: >
    A result and a stored visual may share a name. `drop(name=...)` removes whatever carries it —
    result, visual, or both — and the return reports each half.
  source: CLAUDE.md#key-concepts
  mode: behavioral
  falsifier: >
    Dropping a name removes only one of the two and reports success, or a collision is refused
    on one side while the other can still claim the name.
  status: verified
  covered_by:
  - tests/test_visual_store.py::TestDrop::test_a_result_and_a_visual_of_one_name_go_together
  - tests/test_visual_store.py::TestDrop::test_removes_a_visual_and_reports_it
  - tests/test_visual_store.py::TestDrop::test_dropping_a_flow_counts_its_visuals
  - tests/test_visual_store.py::TestDrop::test_dropping_an_unrelated_name_leaves_the_visual
  note: >
    An earlier draft specified one namespace with the collision refused. That was enforcement in
    one direction only: the check sat in the `save_as` path while `query(name=...)` could claim
    the name from the other side. Closing it symmetrically needs guards on THREE materialize
    paths — _materialize_query (query and every batch step), the fetch materialize, and replay's
    rebuild — and partial enforcement of an invariant is worse than none, because the register
    would then certify something untrue. It would also be stricter than results treat each
    other, since `query` already lets one result silently replace another by name. So the
    ambiguity is resolved by REPORTING rather than prohibiting.

- id: VIS-024
  claim: >
    `replay` carries a flow's visuals — copying the definition when rebuilding `into` a fresh
    flow — and reports drift against the rebuilt schema without ever failing the rebuild.
  source: CLAUDE.md#key-concepts
  mode: behavioral
  falsifier: >
    A rebuild `into` a fresh flow leaves the charts behind in the source flow, or a chart whose
    column was renamed raises and aborts a replay whose data rebuild had already succeeded.
  status: verified
  covered_by:
  - tests/test_visual_store.py::TestReplayCarry::test_into_copies_the_definition_and_it_redraws_there
  - tests/test_visual_store.py::TestReplayCarry::test_in_place_carries_without_touching_the_spec
  - tests/test_visual_store.py::TestReplayCarry::test_a_renamed_column_is_reported_stale_not_raised
  - tests/test_visual_store.py::TestReplayCarry::test_a_missing_read_target_is_reported_not_raised
  note: >
    The third disposition beside `rebuilt` and `preserved`. Skipping the copy produces exactly
    the failure the fetch branch's own comment warns about: a "complete" rebuild where the data
    is present and the charts are orphaned. The missing-result case is the one most likely to be
    written as an unguarded schema lookup, which would raise MID-replay — after results are
    already rebuilt — turning a reporting concern into a half-finished operation. Because
    visuals are not lineage nodes, none of this lives in the rebuild loop: `_carry_visuals`
    reads the store directly, which is why no `kind='visual'` node can ever reach
    `CREATE OR REPLACE TABLE ... AS {node["sql"]}`. The drift this reports is exactly the set
    VIS-007 enforces — same extractor, so a chart is never called stale for a column a redraw
    would draw — which means it also inherits VIS-007's expression-string boundary, and inherits
    it in STORED form: `fields` is computed once at authoring time, so widening the extractor
    later improves new rows only until the old ones are backfilled from the specs beside them.

- id: VIS-025
  claim: >
    `replay(dry_run=True)` reports a visual whose read target is absent, and does NOT claim to
    predict field drift — that needs a post-rebuild schema, which needs an actual rebuild.
  source: CLAUDE.md#key-concepts
  mode: behavioral
  falsifier: >
    A dry run reports `missing_fields`, implying a plan can see a schema that does not exist
    yet — or it omits visuals entirely, leaving the caller to assume there are none.
  status: verified
  covered_by:
  - tests/test_visual_store.py::TestReplayCarry::test_dry_run_reports_visuals_but_cannot_predict_drift
  note: >
    Stating the limit is the point. A dry run that silently reported an empty `stale` list would
    read as "no charts will break", which is a stronger claim than it can make.

- id: VIS-026
  claim: >
    Given a chart it has already authored and stored, an agent redraws it with `saved=` rather
    than re-authoring the whole spec.
  source: CLAUDE.md#tool-surface
  mode: affordance
  falsifier: >
    With a stored visual available and named in `catalog`, an agent still sends a full spec on
    every look, or re-authors rather than redrawing after a `replay`.
  status: unverified
  covered_by: []
  gap: >
    The amortisation the whole store rests on: it only pays if the agent actually reaches for
    `saved=` instead of re-authoring out of habit. Like VIS-015 this cannot be closed by unit
    tests — it is about what a model DOES when handed the surface — but it is an unusually clean
    thing to measure, because re-authoring and redrawing differ by orders of magnitude in output
    tokens. A harness with an ablation arm (the same server with and without `save_as`/`saved`)
    would settle it.

- id: VIS-015
  claim: >
    Handed a result whose shape is the point, an agent draws a chart rather than dumping rows —
    and aggregates first instead of hitting the cap.
  source: CLAUDE.md#tool-surface
  mode: affordance
  falsifier: >
    With `visual` available, an agent still answers a "which region grew fastest" question with
    a wall of JSON, or reaches for a spec over a 100k-row result and takes the error as a dead
    end rather than aggregating.
  status: unverified
  covered_by: []
  gap: >
    An affordance claim cannot be closed by unit tests: it is about what an agent DOES when
    handed this surface, which needs a harness with an ablation arm (the same server with and
    without `visual` registered). Inherited unchanged from SHOW-012 — and it is now the more
    interesting of the two, because `visual` asks the agent to author a spec rather than pick a
    `kind`, so the question is not only whether it draws but whether what it authors is any
    good. That is the assumption the whole stored-artifact design rests on.
