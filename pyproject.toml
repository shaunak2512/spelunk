[project]
name = "spelunk"
version = "0.0.1"
description = "A multi-source DuckDB query + transformation-pipeline MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "sqlglot>=25.0",
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "pyarrow>=15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spelunk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
