[project]
name = "spelunk-mcp"
version = "0.2.1"
description = "A multi-source DuckDB query + transformation-pipeline MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shaunak" }]
keywords = ["mcp", "duckdb", "sql", "data", "pipeline", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=1.5",
    "sqlglot>=25.0",
    # 3.4, not 2.x: `--transport http` passes transport="http" AND a `middleware=` list to
    # FastMCP.run for the DNS-rebinding guard. FastMCP 2.0 has neither — it would fail at the
    # run() call, i.e. after startup looked fine. Verified present in 3.4.0.
    "fastmcp>=3.4",
    "pydantic>=2.7",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/shaunak2512/spelunk"
Repository = "https://github.com/shaunak2512/spelunk"
Issues = "https://github.com/shaunak2512/spelunk/issues"

[project.scripts]
spelunk = "spelunk.mcp.server:main"

[project.optional-dependencies]
# PyYAML is for evals/coverage.py — the claim register lives in YAML and the script is part of
# the documented dev workflow, so a clean `--extra dev` install must be able to run it.
dev = ["pytest>=8.0", "pytest-cov", "ruff", "pyarrow>=15.0", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spelunk"]

# CLAUDE.md is agent guidance for working *on* Spelunk — useful in a clone, noise in a release.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
