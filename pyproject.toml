[project]
name = "spelunk-mcp"
version = "0.1.0"
description = "A multi-source DuckDB query + transformation-pipeline MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shaunak" }]
keywords = ["mcp", "duckdb", "sql", "data", "pipeline", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=1.5",
    "sqlglot>=25.0",
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/shaunak2512/spelunk"
Repository = "https://github.com/shaunak2512/spelunk"
Issues = "https://github.com/shaunak2512/spelunk/issues"

[project.scripts]
spelunk = "spelunk.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "pyarrow>=15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spelunk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
