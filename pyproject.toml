[project]
name = "spelunk-mcp"
version = "0.2.1"
description = "A multi-source DuckDB query + transformation-pipeline MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shaunak" }]
keywords = ["mcp", "duckdb", "sql", "data", "pipeline", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=1.5",
    "sqlglot>=25.0",
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/shaunak2512/spelunk"
Repository = "https://github.com/shaunak2512/spelunk"
Issues = "https://github.com/shaunak2512/spelunk/issues"

[project.scripts]
spelunk = "spelunk.mcp.server:main"

[project.optional-dependencies]
# The `show` tool's renderer. Kept optional so the core install stays lean — without it `show`
# is simply not registered, rather than present and always failing. Pinned EXACTLY, as the
# Prefab/FastMCP guide instructs ("pin prefab-ui explicitly rather than relying on
# minimum-version constraints"): prefab-ui is pre-1.0 and expects breaking changes, and the
# version ALSO selects the JS bundle the iframe loads (the renderer HTML points at
# cdn.jsdelivr.net/npm/@prefecthq/prefab-ui@<this version>), so an upgrade changes what users'
# browsers fetch, not just what the server imports. Spelunk additionally builds its own renderer
# resource from this package's HTML (see views.recovery_renderer_html), which is a second reason
# a surprise version bump should never happen silently.
# fastmcp>=3.4 is NOT redundant with the core pin: the base dependency is `fastmcp>=2.0`, and
# `@mcp.tool(app=True)` plus the ui:// renderer synthesis only exist in 3.x. Without this bound
# a 2.x resolution installs prefab-ui, satisfies PREFAB_AVAILABLE, and then fails at
# registration on an unexpected keyword — a broken server rather than a missing tool.
ui = ["prefab-ui==0.20.2", "fastmcp>=3.4"]
# PyYAML is for evals/coverage.py — the claim register lives in YAML and the script is part of
# the documented dev workflow, so a clean `--extra dev` install must be able to run it.
# prefab-ui rides along so tests/test_show.py actually runs instead of skipping.
dev = [
    "pytest>=8.0", "pytest-cov", "ruff", "pyarrow>=15.0", "PyYAML>=6.0",
    "prefab-ui>=0.20,<0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spelunk"]

# CLAUDE.md is agent guidance for working *on* Spelunk — useful in a clone, noise in a release.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
