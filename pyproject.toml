[project]
name = "spelunk-mcp"
version = "0.2.1"
description = "A multi-source DuckDB query + transformation-pipeline MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shaunak" }]
keywords = ["mcp", "duckdb", "sql", "data", "pipeline", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=1.5",
    "sqlglot>=25.0",
    # 3.4, not 2.x — two independent reasons, either one sufficient:
    #   * server.py imports `fastmcp.apps.config` and `fastmcp.tools.base.ToolResult`
    #     unconditionally (the MCP Apps wiring `show` needs), and neither path exists in 2.x.
    #     A 2.x resolution fails at IMPORT time — a server that never starts, not a missing tool.
    #   * `--transport http` passes transport="http" AND a `middleware=` list to FastMCP.run for
    #     the DNS-rebinding guard. 2.0 has neither, and that one fails at the run() call, i.e.
    #     after startup looked fine. Both verified present in 3.4.0.
    "fastmcp>=3.4",
    "pydantic>=2.7",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/shaunak2512/spelunk"
Repository = "https://github.com/shaunak2512/spelunk"
Issues = "https://github.com/shaunak2512/spelunk/issues"

[project.scripts]
spelunk = "spelunk.mcp.server:main"

[project.optional-dependencies]
# `visual` needs NO Python rendering package: a Vega-Lite spec is JSON and the app page is a
# hand-written HTML string, so the whole display surface ships in the core install and is always
# registered. (This extra used to carry prefab-ui, whose absence silently dropped the old `show`
# tool; nothing is optional about `visual`.) The fastmcp bound restates the core pin rather than
# raising it — kept explicit because the MCP Apps surface (`AppConfig`, the ui:// resource) is
# what `visual` is built on, so the requirement stays visible if the core floor is relaxed.
ui = ["fastmcp>=3.4"]
# PyYAML is for evals/coverage.py — the claim register lives in YAML and the script is part of
# the documented dev workflow, so a clean `--extra dev` install must be able to run it.
# jsonschema: without it test_every_payload_validates_against_it importorskips, so the check that
# `visual`'s declared output schema matches its payloads would never actually run.
dev = [
    "pytest>=8.0", "pytest-cov", "ruff", "pyarrow>=15.0", "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spelunk"]

# CLAUDE.md is agent guidance for working *on* Spelunk — useful in a clone, noise in a release.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
